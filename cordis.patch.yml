# ai-prompt-kit bundle patch
#
# 这一行是「挂载声明」：安装 bundle 后由 Loader 插入 host 插件行。
# 想改配置（libraryRoot / injectRules / language），在 profile 的 cordis.patch.yml 里
# 按 id 覆盖即可；想整个关掉，用插件管理的开关（set_bundle），不要删这个文件。
#
# 注意：这里不写死 libraryRoot —— 省略时插件回落到
#   1) 环境变量 AI_PROMPT_KIT_DIR
#   2) ~/ai-prompt-library
# 这样这份 patch 在任何机器上都能直接用。
- insert:
    - id: ai-prompt-kit
      name: ai-prompt-kit
      inject: [systemPrompt, tools]
      config:
        injectRules: true
        language: zh
